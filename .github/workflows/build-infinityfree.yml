name: Build InfinityFree Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build for traditional hosting
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      - name: Package website
        run: |
          cd dist
          zip -r ../henox-infinityfree.zip .
      - name: Upload hosting package
        uses: actions/upload-artifact@v4
        with:
          name: henox-infinityfree
          path: henox-infinityfree.zip
          if-no-files-found: error
