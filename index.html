<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- SEO Meta Tags -->
    <title>Henox Business Consultant - Document Digitization & EDMS Solutions Kenya</title>
    <meta name="description" content="Kenya's premier document digitization specialists. Expert backlog scanning, EDMS installation, secure document destruction & file registry services. Transform your business with cutting-edge technology. Serving Nairobi & nationwide." />
    <meta name="keywords" content="document digitization Kenya, EDMS installation, document scanning Nairobi, file management, document destruction, backlog scanning, electronic document management system" />
    <meta name="author" content="Henox Business Consultant Limited" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://henoxbusiness.co.ke" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://henoxbusiness.co.ke" />
    <meta property="og:title" content="Henox Business Consultant - Document Digitization & EDMS Solutions Kenya" />
    <meta property="og:description" content="Transform your business with Kenya's leading document digitization specialists. Expert scanning, EDMS setup, and secure file management solutions." />
    <meta property="og:image" content="https://henoxbusiness.co.ke/og-image.jpg" />
    <meta property="og:site_name" content="Henox Business Consultant" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://henoxbusiness.co.ke" />
    <meta property="twitter:title" content="Henox Business Consultant - Document Digitization & EDMS Solutions Kenya" />
    <meta property="twitter:description" content="Transform your business with Kenya's leading document digitization specialists. Expert scanning, EDMS setup, and secure file management solutions." />
    <meta property="twitter:image" content="https://henoxbusiness.co.ke/og-image.jpg" />
    
    <!-- Additional SEO -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Nairobi" />
    <meta name="geo.position" content="-1.286389;36.817223" />
    <meta name="ICBM" content="-1.286389, 36.817223" />
    
    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden static form so Netlify's build-time bot can detect and register this form. -->
    <!-- Do not remove: the React contact form submits to this same form name via fetch(). -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
